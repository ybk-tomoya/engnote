[package]
name = "engnote-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "engnote"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
clap_complete = { version = "4.6.8", features = ["unstable-dynamic"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
engnote-core = { path = "../engnote-core" }
ulid = "3.0.0"
